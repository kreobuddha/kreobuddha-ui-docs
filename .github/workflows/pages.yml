name: Pages

# A push to `master` publishes the site, so this workflow is the release mechanism, not a build
# step. `workflow_dispatch` is kept so the site can be republished without an empty commit.
on:
  workflow_dispatch:
  push:
    branches: [master]

# Actions are pinned to a commit with the version beside it: a tag is a movable pointer and a
# commit is not, so pinning by tag would let a compromised release run here without any change
# landing in this repository.

permissions:
  contents: read
  # What Pages needs and nothing more: `pages` to publish the artifact, `id-token` for the OIDC
  # token `deploy-pages` exchanges for the deployment.
  pages: write
  id-token: write

# The site has one live version, so overlapping runs would race to be it. A run already in flight
# is not cancelled — cancelling mid-deployment leaves the site serving half of an upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      # A project site lives at `https://<owner>.github.io/<repo>/`, not at the host root. This
      # step reports that sub-path instead of the workflow hard-coding it, and `next.config.ts`
      # reads it as `basePath`. Local builds leave the variable unset and run from the root.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages

      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out

      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deploy
