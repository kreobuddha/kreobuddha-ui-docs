name: CI

on:
  # Deliberately unfiltered: a pull request is checked wherever it is aimed, so a branch stacked on
  # another unreviewed branch is verified too.
  pull_request:

# Actions are pinned to a commit with the version beside it. A tag is a movable pointer — whoever
# can write to the action's repository can repoint `v7` at different code, and every workflow
# trusting the tag runs it on the next push with nothing in this repository having changed.

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# There is no push trigger. A push to `master` already runs `pages.yml`, which performs the same
# build against the same commit and refuses to publish if it fails, so a second run would buy an
# earlier red mark and nothing else.
jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The version `pages.yml` deploys with. A build that passes here has to be the build that
          # ships.
          node-version: 24.x
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Node runs these straight from TypeScript. They cover the rules that are awkward to observe
      # in a browser — the scroll-spy decision at the top, at the bottom, and across a jump.
      - run: npm test

      # The browser is keyed on the lockfile, because that is what pins the Playwright version: a
      # stale browser against a newer Playwright is the mismatch this guards.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - run: npx playwright install --with-deps chromium

      # Where that browser landed, for Lighthouse further down.
      - id: chromium
        run: |
          echo "path=$(node -e "console.log(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_OUTPUT"

      # Builds the export under the deployed sub-path and drives it in a real browser, at 1280 and
      # at 320. The build is part of the script, so there is no second unprefixed build here: the
      # one that ships is the one that is tested. `e2e/axe.spec.ts` rides along: every scan runs in
      # both projects, so the accessibility gate is checked at 1280 and at 320 as well.
      - run: npm run e2e

      # Reads the built CSS, so it runs after the build. Guards the cascade layer order, which is
      # decided by the bundler rather than by the source.
      - run: npm run check:css

      # Reads the built HTML, so it runs after the build too. Every internal href has to resolve to
      # a file the export actually wrote, every `#fragment` to an element that exists, and no
      # absolute link may escape `basePath` — the last of which only shows up in a build made under
      # the sub-path, which is exactly what `npm run e2e` left behind.
      - run: npm run check:links

      # Lighthouse drives Chrome, and the one already on disk is the browser the suite above was
      # pinned to. Letting `chrome-launcher` find whatever the runner image happens to ship would
      # mean the budget is measured against a browser nothing else in this workflow used.
      - name: Measure performance and accessibility
        run: npm run lighthouse
        env:
          CHROME_PATH: ${{ steps.chromium.outputs.path }}

      # Kept whether the budget passed or failed — a failed budget is the case where someone needs
      # to read the report.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7
