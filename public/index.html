<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>@kreobuddha/ui — documentation</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="./en/" />
    <script>
      /*
       * The site root picks a locale and leaves. Static export rules this out at the server: there
       * is no middleware to redirect on `Accept-Language`, so the choice is made here, once.
       *
       * A stored choice wins over the browser's languages, because it is the reader saying so
       * rather than the operating system guessing. Every URL here is relative, which is what keeps
       * this file free of `basePath`: it works from a sub-path and from a bare domain unchanged.
       */
      (function () {
        var supported = ['en', 'ru'];
        var stored = null;
        try {
          stored = localStorage.getItem('kb-docs-locale');
        } catch (error) {
          // Storage can be blocked outright. Not knowing the reader's choice is not fatal.
        }

        var chosen =
          supported.indexOf(stored) !== -1
            ? stored
            : (navigator.languages || [navigator.language || 'en'])
                .map(function (tag) {
                  return String(tag).toLowerCase().split('-')[0];
                })
                .filter(function (tag) {
                  return supported.indexOf(tag) !== -1;
                })[0] || 'en';

        location.replace('./' + chosen + '/');
      })();
    </script>
  </head>
  <body>
    <noscript>
      <p><a href="./en/">English</a> · <a href="./ru/">Русский</a></p>
    </noscript>
  </body>
</html>
